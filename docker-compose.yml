services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: uavros_ws:noetic
    container_name: uavros_dev
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XAUTHORITY=/home/ros/.Xauthority
    volumes:
      - .:/home/ros/uavros_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/ros/.Xauthority:rw
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"
    runtime: ${DOCKER_RUNTIME:-runc}
