      - erb {{.M}}/usl_bv2/models/usl_bv2/model.rsdf > {{.M}}/usl_bv2/models/usl_bv2/model.sdf

  erb-usl_bv2:usl_bv2_base:
    desc: usl_bv2_base
    cmds:
      - erb {{.M}}/usl_bv2/models/usl_bv2_base/model.rsdf > {{.M}}/usl_bv2/models/usl_bv2_base/model.sdf

  erb-usl_bv2:usl_bv2_tilt1:
    desc: usl_bv2_tilt1
