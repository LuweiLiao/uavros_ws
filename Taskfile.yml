# yaml-language-server: $schema=https://taskfile.dev/schema.json
# 从 .vscode/tasks.json 迁移的 Gazebo 模型 rsdf -> sdf 构建任务

version: '3'

vars:
  M: src/uav_simulator/uav_gazebo/models
  W: src/uav_simulator/uav_gazebo/worlds

tasks:
  default:
    desc: 构建 usl_bv2 模型（原 tasks.json 默认构建）
    deps: [erb-usl_bv2:usl_bv2]

  # ---- usl_bv2 ----
  erb-usl_bv2:usl_bv2:
